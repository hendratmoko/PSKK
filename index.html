anding":"Banding ini diajukan atas Keputusan Asesmen yang dibuat terhadap Skema Sertifikasi (Kualifikasi/Klaster/Okupasi) berikut :","alasan":"Banding ini diajukan atas alasan sebagai berikut :","hak":"Anda mempunyai hak mengajukan banding jika anda menilai proses asesmen tidak sesuai SOP dan tidak memenuhi prinsip asesmen."},"ia02":{"petunjuk":["Baca dan pelajari setiap instruksi kerja di bawah ini dengan cermat sebelum melaksanakan praktek","Periksalah dengan teliti dokumen soal ujian praktik.","Baca dan pahami maksud soal agar tidak terjadi kesalahan pekerjaan.","Bekerjalah dengan memperhatikan jadwal dengan alur pengerjaan.","Peralatan utama dan bahan telah disediakan sesuai dengan kebutuhan.","Dalam bekerja selalu memperhatikan keselamatan kerja.","Klarifikasi kepada Asesor apabila ada hal-hal yang belum jelas","Laksanakan pekerjaan sesuai dengan urutan proses yang sudah ditetapkan","Seluruh proses kerja mengacu kepada SOP/WI yang dipersyaratkan"],"waktu":["Waktu : 24 jam"],"skenario":["Skenario Tugas Praktik Demonstrasi:","Dalam rangka mencapai kualifikasi sebagai pemrogram junior, Anda diminta untuk membuat Program Aplikasi Perpustakaan dan design bebas menurut kemampuan Anda, dengan memperhatikan persyaratan yang telah ditentukan."],"rows":[{"no":"1","sken":"Mengidentifikasi konsep data dan struktur data","ins":["Identifikasilah konsep data dan struktur data sesuai dengan konteks permasalahan","Bandingkanlah kelebihan dan kekurangan alternatif struktur data untuk konteks permasalahan yang diselesaikan"]},{"no":"2","sken":"Menerapkan struktur data dan akses terhadap struktur data tersebut","ins":["Implementasikanlah struktur data sesuai dengan bahasa pemrograman yang akan dipergunakan","Nyatakanlah akses terhadap data dalam algoritma yang efisiensi sesuai bahasa pemrograman yang akan dipakai"]},{"no":"3","sken":"Menggunakan metode pengembangan program","ins":["Definisikanlah metode pengembangan aplikasi (software development)","Pilihlah metode pengembangan ap },{"no":"2.","nama":"Aplikasi tools pemrograman","spek":["IDE/Text Editor (VSCode/GitHub/Sublim/etc)"],"jml":"1","ket":""},{"no":"3.","nama":"Bahasa pemrograman","spek":["C#/VB.Net/Java/PHP/ swift/kotlin/ASP/etc"],"jml":"1","ket":""},{"no":"4.","nama":"Aplikasi server","spek":["DbS/VPN/FTP/WebServer/ProxyServer/DNSServer/DHCP"],"jml":"1","ket":""},{"no":"5.","nama":"Aplikasi Pendukung","spek":["Web Server","AI","Power Designer","PHP Documentor"],"jml":"1","ket":""},{"sec":"Bahan"},{"no":"1.","nama":"Data-data referensi","spek":["Rekaan sendiri"],"jml":"Sesuai kebutuhan","ket":""},{"no":"2.","nama":"ATK","spek":[],"jml":"Sesuai kebutuhan","ket":""}],"penutup":["Dalam penerapannya, Anda juga diminta untuk menggunakan SOP organisasi yang sesuai dengan sikap kerja yang teliti dan tepat waktu dalam pemrograman web. Setelah selesai melaksanakan tugas, Anda diminta merapikan kembali peralatan yang digunakan.","Waktu : 2 x 10 Jam"]},"ia03":{"panduan":["Formulir ini di isi oleh asesor kompetensi dapat sebelum, pada saat atau setelah melakukan asesmen dengan metode observasi demonstrasi.","Pertanyaan dibuat dengan tujuan untuk menggali, dapat berisi pertanyaan yang berkaitan dengan dimensi kompetensi, batasan variabel dan aspek kritis yang relevan dengan skenario tugas dan praktik demonstrasi.","Jika pertanyaan disampaikan sebelum asesi melakukan praktik demonstrasi, maka pertanyaan dibuat berkaitan dengan aspek K3L, SOP, penggunaan peralatan dan perlengkapan.","Jika setelah asesi melakukan praktik demonstrasi terdapat item pertanyaan pendukung observasi telah terpenuhi, maka pertanyaan tersebut tidak perlu ditanyakan lagi dan cukup memberi catatan bahwa sudah terpenuhi pada saat tugas praktek demonstrasi pada kolom tanggapan","Jika pada saat observasi ada hal yang perlu dikonfirmasi sedangkan di instrumen daftar pertanyaan pendukung observasi tidak ada, maka asesor dapat memberikan pertanyaan dengan syarat pertanyaan harus berkaitan dengan tugas praktek demonstrasi. Jika dilakukan, asesor harus mencatat dalam instrumen pertanyaan pendukung observasi.","Tanggapan asesi ditulis pada kolom tanggapan."],"q":[{"tag":"J.62000.004.02 JRES","kode":"J.62000.004.02","tipe":"JRES","text":"Dari aplikasi yang Anda bangun, tipe struktur data apa yang Anda implementasikan dalam aplikasi tersebut? Dan mengapa Anda menggunakan tipe struktur data tersebut!"},{"tag":"J.62000.004.02 TRS","kode":"J.62000.004.02","tipe":"TRS","text":"Mengapa metode pemodelan data waterfall dianggap kurang fleksibel? Dan metode pemodelan apa yang cocok dalam aplikasi yang Anda buat??"},{"tag":"J.62000.009.01 TRS","kode":"J.62000.009.01","tipe":"TRS","text":"Software apa yang Anda gunakan dalam membangun project Anda? Apakah software tersebut sudah tepat untuk menyelesaikan project Anda?"},{"tag":"J.62000.016.01 JRES","kode":"J.62000.016.01","tipe":"JRES","text":"Menurut Anda apakah aplikasi yang Anda bangun sudah memenuhi ketepatan penulisan kode sesuai guidelines dan best practices? Berikan alasannya!"},{"tag":"J.62000.017.02 TRS","kode":"J.62000.017.02","tipe":"TRS","text":"Ada dua macam system percabangan, yaitu if dan switch. Apakah fungsi dari system percabangan switch?"},{"tag":"J.62000.017.02 CMS","kode":"J.62000.017.02","tipe":"CMS","text":"Jelaskan algoritma dari proses WEB/ Game/Meta/Software dalam aplikasi yang sudah Anda bangun!"},{"tag":"J.62000.025.02 CMS","kode":"J.62000.025.02","tipe":"CMS","text":"Ada 3 jenis bug, jelaskan perbedaan dari ketiga jenis bug tersebut! Kemudian bagaimanakan Langkah kita dalam mencari bugs dalam program aplikasi yangsudah Anda buat?"},{"tag":"J.62000.033.02 TRS","kode":"J.62000.033.02","tipe":"TRS","text":"Apa saja yang harus dipersiapkan dalam melaksanakan uji unit program?"}]},"ia05":{"note":["ONLINE:"]},"ia06":{"intro":["*Coret yang tidak perlu","Task Skills (tugas rutin, Pengetahuan), Task Management Skills (mengelola tugas berbeda,Keterampilan), Contingency Management Skills (tanggap masalah,Atitude), Job/Role Environment Skills (lingkungan kerja,K3), dan Transfer Skills (adaptasi kemampuan ke situasi baru, Atitude Transfer).","Komponen dasarnya melibatkan Knowledge, Skill, dan Attitude.","Jawab semua pertanyaan di bawah ini:"],"q":["Buatlah flowchart login dalam sebuah aplikasi web! (TMS)","Buatlah sebuah ERD dalam basis data Entitas! (TS)","Buatlah script untuk membuat file koneksi dengan menggunakan PHP. Ketentuan untuk nama database = “login” (TRS)","Perintah untuk memasukkan yang benar agar menampilkan tampilan seperti dibawah ini: “ini tombol input dengan type=”submit”: Kirimkan adalah... (JRES)","Apa yang dilakukan user dalam Framework Code Igniter? (TRS)","Bagaimanakah perbedaan diagram Abstract Windowing Toolkit (AWT) dengan Swing? (TMS)","Sesuai dengan project yang kalian buat, platform apa saja yang digunakan dalam membangun project tersebut? (TRS)","Tuliskan struktur data terkait tipe data yang cocok untuk mendefiniskan data obyek yang terdiri dari entitas data yang berhubungan dengannya (contoh data siswa yang terdiri dari nisn, nis, nama, id_kelas, alamat, no_telp, id_spp) (CMS)"],"catatan":["Catatan:","Daftar pertanyaan dapat berisi pertanyaan dari semua dimensi kompetensi. Jika ada pertanyaan yang tidak dijawab, maka dapat dieksplorasi dari menilai melalui pertanyaan verbal.","Pertanyaan juga dapat difokuskan pada akurasi dan presisi yang dapat membantu memberikan rekomendasi tindak lanjut untuk menilai.","Pertanyaan presisi jika tidak dapat dijawab, penilai disarankan untuk menambahkan lebih banyak latihan / bekerja di bawah pengawasan, sedangkan jika pertanyaan akurasi dilewatkan maka penilai direkomendasikan untuk pelatihan ulang"]},"ia06a":{"n":8,"fb":"Aspek pengetahuan seluruh unit kompetensi yang diujikan (tercapai/ belum tercapai)* Tuliskan unit/elemen/KUK jika belum tercapai: …."},"ia07":{"panduan":["Instruksi:","Pertanyaan lisan merupakan jenis bukti tambahan untuk mendukung bukti-bukti yang sudah ada.","Buatlah pertanyaan lisan yang dapat mencakupi penguatan informasi berdasarkan KUK, batasan variabel, pengetahuan dan ketrampilan esensial, sikap dan aspek kritis.","Perkiraan jawaban dapat dibuat pada lembar lain.","Tanggapan/penilaian dapat diisi dengan centang (v) pada kolom K (kompeten) atau BK (belum kompeten). Dibutuhkan jastifikasi profesional asesor untuk memutuskan hal ini."],"instruksi":["Ajukan pertanyaan kepada asesi dari daftar terlampir untuk mengonfirmasi pengetahuan, sebagaimana diperlukan.","Tulis jawaban asesi secara singkat di tempat yang disediakan untuk setiap pertanyaan.","Tempatkan centang di kotak untuk mencerminkan prestasi asesi (Kompeten ‘K’ atau Belum Kompeten ‘BK’)."],"units":[{"kode":"J.62000.004.02","judul":":","prod":"PRODUK:","q":[{"no":1,"text":"Dalam pembuatan WEB/ Game/Meta/Software/Aplikasi* sudah terintegrasi dengan basis data, untuk itu operasi dasar apa saja apa saja yang digunakan dalam source code project yang Anda buat? Jelaskan fungsi dari tiap operasi dasar yang digunakan tersebut!","kunci":["Operasi dasar yang digunakan adalah :","Insert : untuk menginputkan data dalam basis data","Select : untuk menampilkan data dari basis data","Update : untuk mengubah data dalam basis data","Delete : untuk menghapus data dalam basis data"]}]},{"kode":"J.62000.009.01","judul":":","prod":"PRODUK:","q":[{"no":2,"text":"Salah satu metode pengembangan perangkat lunak adalah model pengembangan prototyping. Mengapa metode ini lebih sering digunakan dan mudah untuk diimplementasikan?","kunci":["Karena pengembangan prototype berdasarkan pada ide untuk mengembangkan implementasi awal, memperlihatkannya kepada user untuk dikomentari, dan memperbaikinya secara bertahap sampai sistem yang memenuhi persyaratan diperoleh","Blok \"Forever\" digunakan untuk menjalankan kode di dalamnya secara terus-menerus, penting untuk membuat aksi yang terus berlangsung dalam game."]}]},{"kode":"J.62000.010.01","judul":":","prod":"PRODUK:","q":[{"no":3,"text":"Dalam mengeksekusi program yang telah Anda buat, diperlukan pre-request tools pemrograman apa saja?","kunci":["Pemrograman Perpustakaan membutuhkan server lokal (localhost)","Klik tombol \"Choose a Sprite from Library\" dan pilih karakter atau objek yang diinginkan.","Gunakan blok \"Play Sound\" dan pilih suara yang diinginkan dari pustaka suara Scratch.","Variabel digunakan untuk menyimpan dan mengelola informasi, seperti skor atau nyawa pemain, yang dapat berubah selama permainan."]},{"no":4,"text":"Jelaskan bagaimana proses eksekusi dari project yang telah Anda buat, kemudian identifikasilah hasil eksekusi tersebut!","kunci":["Proses eksekusi Perpustakaan dengan membuka localhost/nama_folder dan otomatis akan memanggil file index.php yang akan memunculkan halaman utama Perpustakaan. Setelah itu, diidentifikasi hasil eksekusi sudah benar atau masih ada error. Jika ada yang error perlu diperbaiki."]}]},{"kode":"J.62000.016.01","judul":":","prod":"PRODUK: WEB/GAME/METAVERSE/SOFTWARE/APLIKASI","q":[{"no":5,"text":"Apa saja yang harus diperhatikan dalam menerapkan coding secara guidelines dan best practice dalam penulisan program (kode sumber)?","kunci":["Memahami tentang deklarasi variabel, operator, kondisional & pilihan, serta string. dan mengimplementasikannya dalam program sederhana dengan menggunakan aplikasi sesuai project yang dibuat","Gunakan blok \"When Arrow Key Pressed\" untuk mengatur pergerakan karakter dan blok-blok pergerakan seperti \"Move 10 Steps\" di dalamnya.","Blok tersebut digunakan untuk membuat kondisi, di mana kode di dalamnya hanya dijalankan jika kondisi tertentu terpenuhi."]}]},{"kode":"J.62000.017.02","judul":":","prod":"PRODUK: WEB/GAME/METAVERSE/SOFTWARE/APLIKASI","q":[{"no":6,"text":"Terdapat 3 macam spesifikasi program, yaitu spesifikasi input, spesifikasi proses, dan spesifikasi output. Dari ketiga spesifikasi tersebut jelaskan bagaimanan pengimplementasiannya dalam project yang anda buat!","kunci":["Spesifikasi input : Menetapkan item data yang akan diinputkan, jenis data, nilai yang valid untuk item data, serta Tindakan yang akan dilakukan jika user berusaha memasukkan data invalid","Spesifikasi proses : Memberikan definisi / penjelasan tentang pemrosesan apa yang diperlukan dengan memberikan gambaran hubungan antara data input dan output","Spesifikasi output : Menetapkan data apa yang dihasilkan","Sprite adalah karakter atau objek yang bergerak di layar, sedangkan backdrop adalah latar belakang atau setting dari scene/game.","Gunakan blok \"When Green Flag Clicked\" dan tambahkan kode untuk mengatur kondisi game over, lalu tambahkan tombol restart dengan blok \"When Green Flag Clicked\" juga.",": Blok \"Broadcast\" digunakan untuk mengirim sinyal ke sprite lain sehingga sprite tersebut dapat menjalankan kode tertentu."]},{"no":7,"text":"Dalam project Anda harus dibuat program dengan bahsa terstruktur, oleh karenanya apa ciri-ciri dari program yang sudah menggunakan bahasa terstruktur?","kunci":["Program handal","Program menjadi sederhana","Program mudah dibaca dan dimengerti","Program mudah ditelusuri kesalahannya","Program mudah dimodifikasi"]},{"no":8,"text":"Tahapan kompilasi pada fase analisis terdapat 3 macam yaitu tahap scanner, parser, semantic. Jelaskan dari masing-masing fase tersebut jika diimplementasikan dalam project yang telah Anda buat!","kunci":["Scanner : membaca program sumber karakter per karakter dikelompokkan menjadi suatu kesatuan mengikuti pola kesatuan kelompok karakter (token)","Parser : token yang didapatkan dari hasil scanner diurutkan atau disusun lalu dikelompokkan ke dalam suatu struktur tertentu secara spesifik.","Semantic : program sumber akan diperiksa untuk mencari kemungkinan kesalahan semantic dengan cara memanfaatkan struktur hirarkikal yang dihasil dari tahapanparser. Pada tahapan ini akan dihasilkan suatu kode yang executable pada kompilasi yang sederhana"]}]},{"kode":"J.62000.023.02","judul":":","prod":"PRODUK: WEB/GAME/METAVERSE/SOFTWARE/APLIKASI","q":[{"no":9,"text":"Basic skill apa saja yang harus dimiliki oleh seseorang yang memahami permograman? Kemudian jelaskan alasannya!","kunci":["Pada dasarnya, basic skill seorang programmer terletak pada keterampilan logika, matematika dasar, dan algoritma. Logika atau kemampuan problem solving akan membantu programmer mengidentifikasi masalah hingga mencari solusi terbaik untuk menangani permasalahan"]},{"no":10,"text":"Dalam proses dokumentasi terdapat dkumentasi teknis. Jelaskan dokumentasi teknis yang diimplementasikan dalam program aplikasi yang Anda bangun!","kunci":["Pembuatan dokumentasi meliputi Software Architecture Document, Activity Diagram, dan Sequence Diagram.","Activity Diagram dan Sequence Diagram sendiri merupakan pemodelan diagram UML (Unified Modeling Language) yang dibutuhkan pada tahap analisis serta desain perangkat lunak. Dokumentasi UML ini kemudian dapat digunakan sebagai media pembantu knowledge transfer antar developer dan siapa pun yang bersinggungan dengan proses pengembangan perangkat lunak terkait."]}]},{"kode":"J.62000.025.02","judul":":","prod":"PRODUK:","q":[{"no":11,"text":"Melakukan debug adalah salah satu hal wajib dalam membangun sebuah aplikasi. Untuk itu sebutkan tujuan dari adanya debugging!","kunci":["PERPUSTAKAAN","Error dapat terdeteksi lebih awal","Proses perbaikan dapat dilakukan sedini mungkin","Menghindari kesalahan desain program lebih lanjut","Dapat memberikan informasi struktur data","Membantu developer mengurangi informasi yang tidak berguna","Mengurangi resiko hacker yang menyusup melalui celah bug atau error","Menghindari proses testing yang rumit sehingga menghemat waktu dan energi saat coding","GAME","Blok tersebut digunakan untuk memulai eksekusi program saat bendera hijau diklik."]}]},{"kode":"J.62000.033.02","judul":":","prod":"PRODUK:","q":[{"no":12,"text":"Jelaskan tujuan dari proses pengujian data aplikasi program!","kunci":["Mendeteksi Kesalahan bahasa (language error), kesalahan yang diakibatkan oleh penulisan dalam penulisan sintaks.","Mendeteksi Kesalahn waktu proses (runtime error), kesalahan yang terjadi Ketika program dijalankan. Kesalahan ini akan menyebabkan proses program terhenti sebelum waktunya untuk berhenti.","Mendeteksi Kesalahan logika (logical error), kesalahan yang disebabkan oleh logika program yang dibuat."]},{"no":13,"text":"Program yang kita bangun perlu adanya uji coba unit program. Jelaskan apa saja yang termasuk dalam prosedur uji coba program?","kunci":["Menentukan kebutuhan tools uji coba","Mempersiapkan data untuk uji coba","Mendesain scenario uji coba","Mendesain prosedur uji coba dalam bentuk algoritma","Melaksanakan uji coba"]},{"no":14,"text":"Setelah program selesai dibuat, maka harus dilakukan analisis hasil uji coba sebutkan dan jelaskan dua analisis hasil uji coba tersebut!","kunci":["Analisis Hasil Uji coba Fitur Dasar Sistem : Analisis hasil uji coba dari keseluruhan uji coba yang dilakukan akan menentukan kelayakan dari fitur dasar sistem berdasarkan desain yang telahdibuat.","Analisis Hasil Uji Coba Proses Pengolahan Data : Analisis hasil uji coba status dilakukan untuk meguji kinerja sistem dalam menentukan kelayakan aplikasi berdasarkan desain yang telah ditetapkan."]}]}]},"ak03":{"komp":["Saya mendapatkan penjelasan yang cukup memadai mengenai proses asesmen/uji kompetensi","Saya diberikan kesempatan untuk mempelajari standar kompetensi yang akan diujikan dan menilai diri sendiri terhadap pencapaiannya","Asesor memberikan kesempatan untuk mendiskusikan/menegosiasikan metoda, instrumen dan sumber asesmen serta jadwal asesmen","Asesor berusaha menggali seluruh bukti pendukung yang sesuai dengan latar belakang pelatihan dan pengalaman yang saya miliki","Saya sepenuhnya diberikan kesempatan untuk mendemonstrasikan kompetensi yang saya miliki selama asesmen","Saya mendapatkan penjelasan yang memadai mengenai keputusan asesmen","Asesor memberikan umpan balik yang mendukung setelah asesmen serta tindak lanjutnya","Asesor bersama saya mempelajari semua dokumen asesmen serta menandatanganinya"," const touch=()=>{A.updated=Date.now();dirty=true;ind();clearTimeout(saveT);saveT=setTimeout(()=>save(false),500);updProg()};
function ind(){const e=$('#saveInd');if(e){e.textContent=saveErr?'⚠ Gagal simpan':dirty?'● Menyimpan…':'✔ Tersimpan';e.className=saveErr?'bad':dirty?'warn':'good'}}
window.addEventListener('beforeunload',e=>{if(dirty||saveErr){e.preventDefault();e.returnValue=''}});
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),t==='err'?7000:3200)}
/* ===== helper isian ===== */
const val=k=>A.f[k]??'';const reg=k=>{if(REQ)REQ.push(k)};
const T=(k,o={})=>{const v=val(k)||o.def||'';return PR?`<span class="pv">${esc(v)||'&nbsp;'}</span>`:`<input data-k="${k}" ${o.type?`type="${o.type}"`:''} value="${esc(v)}" placeholder="${esc(o.ph||'')}">`};
const X=(k,rows=3)=>PR?`<div class="pv pre">${esc(val(k))||'&nbsp;'}</div>`:`<textarea data-k="${k}" rows="${rows}">${esc(val(k))}</textarea>`;
const C=(k,l,req)=>{if(req)reg(k);const v=!!val(k);return PR?`<span class="pv">${v?'☑':'☐'} ${esc(l||'')}</span>`:`<label class="cb"><input type="checkbox" data-k="${k}" ${v?'checked':''}> ${esc(l||'')}</label>`};
const R1=(k,v,l)=>PR?`<span class="pv">${val(k)===v?'☑':'☐'} ${esc(l??v)}</span>`:`<label class="rd"><input type="radio" name="${k}" data-k="${k}" value="${esc(v)}" ${val(k)===v?'checked':''}> ${esc(l??v)}</label>`;
const R=(k,opts,o={})=>{if(!o.opt)reg(k);return `<span class="rg">${opts.map(x=>R1(k,x[0],x[1])).join(' ')}</span>`};
const KB=(k,a='K',b='BK')=>{reg(k);return `<td class="c">${R1(k,a,PR?'':'')}</td><td class="c">${R1(k,b,PR?'':'')}</td>`};
const SEL=(k,opts,def)=>{const v=val(k)||def||'';return PR?`<span class="pv">${esc(v)}</span>`:`<select data-k="${k}">${['',...opts].map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`};
const SG=(k,l)=>PR?`<div class="sigp">${A.sig[k]?`<img src="${A.sig[k]}">`:''}</div>`:`<div class="sigw"><canvas class="sigc" data-s="${k}" width="320" height="110"></canvas><button type="button" class="btn sm" data-clr="${k}">Hapus TTD</button><small>${esc(l||'Tanda tangan digital')}</small></div>`;
const UP=g=>{const L=A.up.filter(u=>u.g===g);const li=L.map(u=>`<li>${esc(u.name)} <small>(${Math.round(u.size/1024)} KB${u.data?'':' – hanya nama tersimpan'})</small>${PR?'':` <button type="button" class="lnk" data-dl="${u.id}">unduh</button> <button type="button" class="lnk bad" data-del="${u.id}">hapus</button>`}</li>`).join('');return (PR?'':`<input type="file" multiple data-up="${g}">`)+`<ul class="ul">${li||(PR?'<li>-</li>':'')}</ul>`};
const done=k=>{const v=val(k);return v===true||(v!==''&&v!=null&&v!==false)};

const ttdAsesor=(k)=>`<table class="t sg"><tr><th colspan="3">Asesor :</th></tr><tr><td>Nama</td><td>:</td><td><b>${SK.asesor}</b></td></tr><tr><td>No. Reg</td><td>:</td><td><b>${SK.reg}</b></td></tr><tr><td>Tanda tangan dan Tanggal</td><td>:</td><td>${SG(k+'.asesor','TTD Asesor')} ${T(k+'.tglAsesor',{type:'date'})}</td></tr></table>`;
const penyusun=()=>`<h4>PENYUSUN DAN VALIDATOR</h4><div class="scroll"><table class="t"><tr>${DATA.penyusun[0].map(c=>`<th>${esc(c[0])}</th>`).join('')}<th>TANDA TANGAN DAN TANGGAL</th></tr>${DATA.penyusun.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c.join(' '))}</td>`).join('')}<td></td></tr>`).join('')}</table></div>`;

{k:'daftar',code:'DAFTAR PERIKSA',title:'DAFTAR PERIKSA KELENGKAPAN DOKUMEN PSKK',fn:()=>{let g='';const rows=DATA.daftar.map((r,i)=>{let h='';if(r.g!==g){g=r.g;h=`<tr class="grp"><td colspan="7">${esc(g)}</td></tr>`}reg('dp.'+i);return h+`<tr><td>${r.no}.</td><td>${esc(r.doc)}</td><td class="c">${C('dp.'+i+'.as')}</td><td class="c">${C('dp.'+i+'.asi')}</td><td class="c">${R1('dp.'+i,'Ada','')}</td><td class="c">${R1('dp.'+i,'Tdk','')}</td><td>${esc(r.ket)} ${T('dp.'+i+'.ket')}</td></tr>`}).join('');return `<h2 class="ft">DAFTAR PERIKSA KELENGKAPAN DOKUMEN PSKK</h2><p><b>Skema:</b> ${SK.judul} · <b>Kode:</b> ${SK.nomor} · <b>Jumlah Unit:</b> ${SK.jumlah}</p><p><b>Nomor Urut Peserta:</b> ${T('nomorUrutX',{def:A.idn.nomorUrut})} · <b>Nama Peserta:</b> ${esc(A.idn.nama||'')} · <b>Asal Institusi:</b> ${esc(A.idn.institusi||'')} · <b>Nama Asesor:</b> ${SK.asesor} · <b>No. Register:</b> ${SK.reg}</p><p class="note"><i>Komponen MUK ini wajib dikembalikan ke LSP bagian data base untuk dilaporkan ke BNSP setelah selesai sidang dewan pertimbangan kompetensi oleh LSP.</i></p><div class="scroll"><table class="t"><tr><th rowspan="2">No</th><th rowspan="2">Jenis Dokumen</th><th colspan="4">Status*)</th><th rowspan="2">Keterangan / Perbaikan</th></tr><tr><th>asesor</th><th>asesi</th><th>Ada</th><th>Tdk</th></tr>${rows}</table></div><div class="two">${ttdAsesor('dp')}${ttdAsesi('dp')}</div>`}},

{k:'ak01',code:'FR.AK.01',title:'PERSETUJUAN ASESMEN DAN KERAHASIAAN',fn:()=>{const D=DATA.ak01;return hdr('FR.AK.01','PERSETUJUAN ASESMEN DAN KERAHASIAAN')+`<div class="box">${esc(D.intro)}</div><table class="t"><tr><td rowspan="2">Bukti yang akan dikumpulkan</td><td>${D.bukti.slice(0,2).map((b,i)=>C('ak01.b'+i,b)).join('<br>')}</td><td>${D.bukti.slice(2,6).map((b,i)=>C('ak01.b'+(i+2),b)).join('<br>')}</td></tr><tr><td colspan="2">${D.bukti.slice(6).map((b,i)=>C('ak01.p'+i,b)).join(' ')}</td></tr><tr><td>Pelaksanaan asesmen disepakati pada</td><td colspan="2">Hari/Tanggal: ${T('ak01.hari',{type:'date'})}<br>Waktu: ${T('ak01.waktu',{ph:'mis. 08.00 – selesai'})}<br>TUK: ${T('ak01.tuk',{ph:'Tempat uji kompetensi'})}</td></tr></table><div class="box"><b>Asesi:</b> ${C('ak01.s1',D.asesi1,true)}</div><div class="box"><b>Asesor:</b> ${C('ak01.s2',D.asesor,true)}</div><div class="box"><b>Asesi:</b> ${C('ak01.s3',D.asesi2,true)}</div><div class="two"><div>Tanda tangan Asesor: ${SG('ak01.asesor','TTD Asesor')} Tanggal: ${T('ak01.tglAsesor',{type:'date'})}</div><div>Tanda tangan Asesi: ${SG('ak01.asesi','TTD Asesi')} Tanggal: ${T('ak01.tglAsesi',{type:'date'})}</div></div>`}},

function validIdn(I){const e={};IDF.forEach(([k,l,r,t])=>{const v=(I[k]||'').toString().trim();if(r&&!v)e[k]=l+' wajib diisi.'});
if(I.nik&&!/^\d{16}$/.test(I.nik.trim()))e.nik='NIK harus 16 digit angka.';
if(I.hp&&!/^(\+62|62|0)8\d{7,12}$/.test(I.hp.replace(/[\s-]/g,'')))e.hp='Format HP tidak valid (contoh 081234567890).';
if(I.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(I.email.trim()))e.email='Format e-mail tidak valid.';
['tglLahir','tanggalAsesmen','tanggalSelesai'].forEach(k=>{if(I[k]){const d=new Date(I[k]);if(isNaN(d)||!/^\d{4}-\d\d-\d\d$/.test(I[k]))e[k]='Format tanggal tidak valid.'}});
if(I.tglLahir&&!e.tglLahir&&new Date(I.tglLahir)>new Date())e.tglLahir='Tanggal lahir tidak boleh di masa depan.';
if(I.tanggalAsesmen&&I.tanggalSelesai&&I.tanggalSelesai<I.tanggalAsesmen)e.tanggalSelesai='Tanggal selesai lebih awal dari tanggal mulai.';
['kodepos','kodeposInst'].forEach(k=>{if(I[k]&&!/^\d{5}$/.test(I[k].trim()))e[k]='Kode pos harus 5 digit.'});return e}

function csvParse(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';r.push(row);row=[]}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y!==''))}

window.resetAll=()=>{if(!confirm('HAPUS SEMUA data asesi di browser ini? Pastikan sudah Export JSON.'))return;if(!confirm('Konfirmasi terakhir: semua data akan hilang permanen.'))return;localStorage.removeItem(LSK);DB={asesi:{},order:[],active:null,view:'dash',form:'daftar',settings:{sheetUrl:''}};load();save();render()};
const GAS=`function doPost(e){\n  var d=JSON.parse(e.postData.contents);\n  var ss=SpreadsheetApp.openById('1V6_G87rjsyYvoxCKqvufL7dyxLseJayk4Gr0PP-LuWE');\n  var sh=ss.getSheetByName('Sheet1')||ss.getSheets()[0];\n  var rows=d.rows||[];\n  if(!rows.length)return ContentService.createTextOutput('kosong');\n  var h=Object.keys(rows[0]);\n  if(sh.getLastRow()===0)sh.appendRow(h);\n  var nikCol=h.indexOf('nik')+1;\n  var ex=sh.getLastRow()>1?sh.getRange(2,nikCol,sh.getLastRow()-1,1).getValues().flat().map(String):[];\n  rows.forEach(function(r){if(ex.indexOf(String(r.nik))<0)sh.appendRow(h.map(function(k){return "'"+r[k]}))});\n  return ContentService.createTextOutput('ok');\n}`;
Vw.panduan=()=>`<h1>Panduan Penggunaan</h1><div class="card"><h3>Alur kerja</h3><ol><li><b>Identitas Asesi</b>: tambah asesi atau <i>Impor Peserta</i> (berkas <code>peserta_2026.json</code>/<code>.csv</code>), lalu lengkapi kolom wajib (tanda <em>*</em>).</li><li><b>Instrumen MUK</b>: lihat seluruh komponen MUK dan progres tiap formulir.</li><li><b>Formulir Asesmen</b>: isi FR.APL.02, AK.01, AK.04, IA.02, IA.03, IA.05, IA.06/06A, IA.07, AK.03, AK.05 serta Daftar Periksa. Isian tersimpan otomatis.</li><li><b>Rekap Penilaian</b> &amp; <b>Hasil Asesmen</b>: tinjau ringkasan, bukti, catatan, kesimpulan, tanda tangan.</li><li><b>Cetak dan Unduh</b>: cetak formulir, bukti pendaftaran, sertifikat; PDF melalui <i>Print → Simpan sebagai PDF</i>.</li></ol></div><div class="card"><h3>Penyimpanan &amp; keamanan</h3><ul><li>Data disimpan di <b>LocalStorage</b> browser perangkat ini — bukan database bersama. Gunakan <b>Export JSON</b> untuk cadangan dan perpindahan perangkat.</li><li>Data setiap asesi terpisah; impor yang bentrok selalu menanyakan konfirmasi.</li><li>Berkas peserta (NIK, HP) <b>jangan</b> diunggah ke repositori publik GitHub. Aplikasi ini sengaja tidak memuat data asesi di dalam kodenya.</li><li>Bila muncul peringatan “Gagal simpan”, memori browser penuh: segera export JSON dan kurangi lampiran.</li></ul></div><div class="card"><h3>Sinkron Google Sheet (opsional)</h3><p>GitHub Pages bersifat statis sehingga tidak dapat menulis langsung ke Google Sheet. Tempel skrip berikut di <i>Extensions → Apps Script</i> pada Sheet “DATA PSKK”, lalu <i>Deploy → Web app</i> (akses: Anyone), dan tempel URL-nya di menu Cetak dan Unduh.</p><pre class="code">${esc(GAS)}</pre></div><div class="card"><h3>Catatan sumber dokumen</h3><p>Isi instrumen dibaca langsung dari berkas MUK RPL April 2026 (kode unit tertulis apa adanya, termasuk ejaan asli dokumen). Kolom yang kosong pada dokumen asli (mis. kolom ke-4 FR.IA.02) diberi isian “Ya/Tidak”; FR.IA.05 tidak memuat butir soal di dokumen (tes online) sehingga disediakan kolom tautan, skor, dan rekomendasi.</p></div>`;
/* ===== event ===== */
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k&&t.type!=='radio'&&t.type!=='checkbox'){A.f[t.dataset.k]=t.value;touch()}else if(t.dataset.i){A.idn[t.dataset.i]=t.value;touch()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.k&&(t.type==='radio'||t.type==='checkbox')){A.f[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;touch()}else if(t.tagName==='SELECT'&&t.dataset.k){A.f[t.dataset.k]=t.value;touch()}else if(t.dataset.i){A.idn[t.dataset.i]=t.value;touch();if(DB.view==='idn'){const e2=validIdn(A.idn);const l=t.closest('.fld');if(l){l.classList.toggle('err',!!e2[t.dataset.i]);l.querySelector('.msg').textContent=e2[t.dataset.i]||''}}if(t.dataset.i==='nama')$('#asSel option:checked').textContent=t.value||'(asesi baru)'}else if(t.dataset.up){upFiles(t)}else if(t.id==='asSel')pick(t.value)});
function upFiles(inp){[...inp.files].forEach(f=>{const r=new FileReader();const add=d=>{A.up.push({id:uid(),g:inp.dataset.up,name:f.name,size:f.size,type:f.type,data:d});touch();render()};if(f.size>300*1024){toast(`"${f.name}" >300 KB: hanya nama berkas disimpan (simpan berkas aslinya di Drive/Arsip).`,'err');add(null)}else{r.onload=()=>add(r.result);r.onerror=()=>toast('Gagal membaca berkas','err');r.readAsDataURL(f)}});inp.value=''}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.del){const u=A.up.find(x=>x.id===t.dataset.del);if(u&&confirm(`Hapus lampiran "${u.name}"?`)){A.up=A.up.filter(x=>x.id!==u.id);touch();render()}}else if(t.dataset.dl){const u=A.up.find(x=>x.id===t.dataset.dl);if(u&&u.data){const a=document.createElement('a');a.href=u.data;a.download=u.name;a.click()}else toast('Berkas asli tidak disimpan (terlalu besar).','err')}else if(t.dataset.clr){delete A.sig[t.dataset.clr];touch();const c=$(`canvas[data-s="${t.dataset.clr}"]`);c.getContext('2d').clearRect(0,0,c.width,c.height)}});
let drw=null;document.addEventListener('pointerdown',e=>{const c=e.target.closest?.('canvas.sigc');if(!c)return;e.preventDefault();c.setPointerCapture(e.pointerId);drw=c;const x=c.getContext('2d'),p=pt(c,e);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#0a1b3d';x.beginPath();x.moveTo(p[0],p[1])});
const pt=(c,e)=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
document.addEventListener('pointermove',e=>{if(!drw)return;const x=drw.getContext('2d'),p=pt(drw,e);x.lineTo(p[0],p[1]);x.stroke()});
const endD=()=>{if(!drw)return;const c=drw;drw=null;const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const g=t.getContext('2d');g.drawImage(c,0,0);A.sig[c.dataset.s]=c.toDataURL('image/png');touch()};document.addEventListener('pointerup',endD);document.addEventListener('pointercancel',endD);
document.addEventListener('DOMContentLoaded',()=>{load();$('#menu').innerHTML=MENU.map(([v,l,i],n)=>`<a class="mi" data-v="${v}" href="#${v}" onclick="event.preventDefault();nav('${v}')">${ico(i)}<span>${n+1}. ${l}</span></a>`).join('');$('#burger').onclick=()=>$('#side').classList.toggle('open');$('#btnSave').onclick=()=>{save(true);const e=validIdn(A.idn);if(Object.keys(e).length)toast('Catatan: identitas belum lengkap/valid ('+Object.keys(e).length+' kolom).','err')};$('#btnResume').onclick=resume;$('#btnReset').onclick=resetA;const h=location.hash.slice(1);if(Vw[h])DB.view=h;if(DB.view==='form'&&!FM[DB.form])DB.form='daftar';render()});
</script></body></html>
